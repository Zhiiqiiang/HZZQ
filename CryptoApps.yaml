# ============================================================
# NAME: CryptoApps
# DESC: 自维护加密货币/交易类 App 分流规则集
# TYPE: Mihomo / Clash 系 rule-provider
# behavior: classical   <- 含 DOMAIN-KEYWORD 与 PROCESS-NAME，
#                          不能改用 domain 行为
# format: yaml
#
# 维护方法：
#   1. 在 FLClash / Clash Verge 连接面板观察目标 App 的连接，
#      凡未命中 💰 Crypto 组的域名，按下面格式追加；
#   2. push 到 GitHub 后等客户端按 interval 拉取，或手动更新规则集；
#   3. 条目类型选择：DOMAIN 精确匹配单个域名；
#      DOMAIN-SUFFIX 匹配该域及全部子域（首选）；
#      DOMAIN-KEYWORD 子串匹配，误伤面大，慎加。
#   4. 同一文件内规则按书写顺序匹配，进程规则放最前。
# ============================================================
payload:
  # ===== 进程规则（安卓按包名命中，其它平台自动跳过） =====
  - PROCESS-NAME,com.binance.dev             # 币安
  - PROCESS-NAME,com.okinc.okex.gp           # 欧易 OKX（安卓包名，Google Play/官网版同名）
  - PROCESS-NAME,com.bitkeep.wallet          # Bitget Wallet（原 BitKeep）
  - PROCESS-NAME,com.bybit.app               # Bybit
  - PROCESS-NAME,com.timonemobile            # Timon
  - PROCESS-NAME,to.plasma.one.application   # Plasma One
  - PROCESS-NAME,etherfi.app                 # ether.fi Cash（安卓包名，Play Store id=etherfi.app）
  - PROCESS-NAME,com.mexcpro.client          # MEXC

  # ===== Binance 币安 =====
  - DOMAIN-KEYWORD,binance                   # 覆盖 binance.com/.us 及 binancezh.* 等全部镜像域
  - DOMAIN-SUFFIX,bnbstatic.com              # 静态资源 CDN
  - DOMAIN-SUFFIX,bntrace.com
  - DOMAIN-SUFFIX,saasexch.com               # 币安 SaaS 经纪商域
  - DOMAIN-SUFFIX,bnbzh.ac                   # 以下为中文备用域
  - DOMAIN-SUFFIX,bnappzh.co
  - DOMAIN-SUFFIX,bnappzh.com
  - DOMAIN-SUFFIX,bnappzh.mobi

  # ===== OKX 欧易 =====
  - DOMAIN-SUFFIX,okx.com                    # 主域，含 www/app/static/ws 等全部子域
  - DOMAIN-SUFFIX,okex.com                   # 2022 改名前旧域，App 内仍有请求
  - DOMAIN-SUFFIX,okcoin.com                 # 同集团 OKCoin
  - DOMAIN-SUFFIX,oklink.com                 # 欧科云链浏览器，App 内链上查询/钱包用
  - DOMAIN-SUFFIX,okx-dns.com                # App 内置域名解析/引导服务（社区抓包）
  - DOMAIN-SUFFIX,okx-dns1.com               # 同上备份，必须与主域同出口，否则 App 会拿到国内镜像域自行跳走
  - DOMAIN-SUFFIX,coinall.ltd                # 早期镜像/备用域（社区抓包）
  - DOMAIN-SUFFIX,cnouyi.pizza               # 国内备用域（社区抓包，可能随时轮换）
  - DOMAIN-SUFFIX,kjmte.com                  # 国内备用域（社区抓包，可能随时轮换）
  - DOMAIN,d1w1p0smpsoh5j.cloudfront.net     # OKX 专用 CloudFront 分发（用 DOMAIN 精确匹配，避免误伤其它 cloudfront）

  # ===== Bybit =====
  - DOMAIN-SUFFIX,bybit.com                  # 主域
  - DOMAIN-SUFFIX,bybit-aws.com              # App 埋点/监控域（社区抓包）

  # ===== Bitget / Bitget Wallet =====
  - DOMAIN-SUFFIX,bitget.com                 # 交易所主域，含 web3.bitget.com 钱包
  - DOMAIN-SUFFIX,bitkeep.com                # 原 BitKeep 遗留域

  # ===== Timon =====
  - DOMAIN-SUFFIX,usetimon.com               # UseTimon 官方域

  # ===== Plasma One =====
  - DOMAIN-SUFFIX,plasma.to                  # Plasma 链主域（含 one.plasma.to）
  - DOMAIN-SUFFIX,plasma.org                 # Plasma One 官网/服务
  
  # ===== ether.fi =====
  - DOMAIN-SUFFIX,ether.fi                   # 主域一网打尽：www / app / api / help / vote / governance 等全部子域
  - DOMAIN-SUFFIX,etherfi.gitbook.io         # 官方技术文档（可选，不看文档可省）

  # ===== MEXC 抹茶 =====
  - DOMAIN-SUFFIX,mexc.com                   # 主域，含 api./wbs-api./futures./contract. 等子域
  - DOMAIN-SUFFIX,mexc.co                    # 官方备用域
  - DOMAIN-SUFFIX,mexc.sg                    # 官方备用域
  - DOMAIN-SUFFIX,mexc.fm                    # 官方备用域（运营方 MEXC，SG 机房）
  - DOMAIN-SUFFIX,mexc.la                    # 官方备用域
  - DOMAIN-SUFFIX,mexc.link                  # 官方短链/跳转域
  - DOMAIN-SUFFIX,mxc.com                    # 旧品牌 MXC 遗留域，仍有跳转
  - DOMAIN-SUFFIX,mxc.co                     # 同上
