# ============================================================
# NAME: Finance
# DESC: 自维护金融/账务类分流规则集（虚拟邮箱、银行、券商等杂项归口）
# TYPE: Mihomo / Clash 系 rule-provider
# behavior: classical  <- 含 PROCESS-NAME，不能改用 domain 行为
# format: yaml
#
# 维护方法：
#   连接面板观察未命中目标策略组的域名，按格式追加后 push。
#   注意：金融类服务风控普遍对出口 IP 归属地和跳变敏感，
#   本集指向的策略组应固定单一地区节点，不要用自动切换组。
# ============================================================
payload:
  # ===== 进程规则（安卓按包名命中，其它平台自动跳过） =====
  - PROCESS-NAME,com.anytimemailbox.renter     # Anytime Mailbox 官方 App（抓包确认）
  - PROCESS-NAME,com.twitter.android           # X 官方 App（含内置 X Money / X Card 页面，无法按进程拆分）
  - PROCESS-NAME,com.whatsapp                  # WhatsApp 安卓版；通话为裸 IP + UDP 无域名，必须靠进程规则接住

  # ===== Anytime Mailbox（美国虚拟邮箱） =====
  - DOMAIN-SUFFIX,anytimemailbox.com           # 主域，含 renter 门户及 API 子域

  # ===== X / X Money / X Card =====
  # X Money 内嵌于 X 主站/主 App，接口走 api.x.com，暂无独立域名，故整个 X 归口本组。
  # 代价：X 全部社交流量同走 Finance 固定节点；若日后抓到专属子域（如 money.x.com）可拆出单独规则。
  - DOMAIN-SUFFIX,x.com                        # 主域 + api.x.com / mobile.x.com 等
  - DOMAIN-SUFFIX,twitter.com                  # 旧域名，App 与网页仍大量调用 api.twitter.com
  - DOMAIN-SUFFIX,twimg.com                    # 图片/视频 CDN；不收则媒体流量会掉到 cdn/全球加速组，出口地区与 API 不一致
  - DOMAIN-SUFFIX,t.co                         # 短链跳转
  - DOMAIN-SUFFIX,twttr.com                    # 内部/实验用域
  - DOMAIN-SUFFIX,tweetdeck.com                # X Pro（TweetDeck）
  - DOMAIN-SUFFIX,pscp.tv                      # Periscope 直播遗留，仍有请求
  - DOMAIN-SUFFIX,periscope.tv                 # 同上
  - DOMAIN-SUFFIX,twitter.jp                   # 日本区域名，偶有跳转
  - DOMAIN-SUFFIX,crossriver.com               # X Money 合作发卡/存款银行 Cross River Bank（KYC/入金链接可能跳转至此）

  # ===== WhatsApp =====
  # 账号风控对出口 IP 跨国跳变敏感（严重可封号），归口固定地区节点。
  # 非安卓/非桌面版（浏览器网页版）的通话流量无域名可匹配，会落到后续 GEOIP/MATCH；
  # 如需覆盖，可追加 Meta AS32934 的 IP-CIDR 段，但会连带 Facebook / Instagram 一起进本组，默认不加。
  - DOMAIN-SUFFIX,whatsapp.com                 # 主站 / web.whatsapp.com / graph.whatsapp.com
  - DOMAIN-SUFFIX,whatsapp.net                 # 消息长连接与媒体：g.whatsapp.net、mmg.whatsapp.net、pps.whatsapp.net、cdn.whatsapp.net
  - DOMAIN-SUFFIX,wa.me                        # 短链
  - DOMAIN-SUFFIX,whatsapp.biz                 # Business 相关
  - DOMAIN-SUFFIX,whatsappbrand.com            # 品牌资源
  - DOMAIN-KEYWORD,whatsapp                    # 兜底：捕获未列出的 whatsapp 子域/变体
