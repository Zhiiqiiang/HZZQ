# ============================================================
# NAME: Finance
# DESC: 自维护金融/账务类分流规则集（银行、券商等杂项归口）
# TYPE: Mihomo / Clash 系 rule-provider
# behavior: classical  <- 含 PROCESS-NAME，不能改用 domain 行为
# format: yaml
#
# 维护方法：
#   连接面板观察未命中目标策略组的域名，按格式追加后 push。
#   注意：金融类服务风控普遍对出口 IP 归属地和跳变敏感，
#   本集指向的策略组应固定单一地区节点，不要用自动切换组。
# ============================================================
payload:
  # ===== 进程规则（安卓按包名命中，其它平台自动跳过） =====
  - PROCESS-NAME,com.ria.moneytransfer         # Ria Money Transfer 官方 App（安卓包名）；含 KYC/风控 SDK、纯 IP 连接统一归口

  # ===== Ria Money Transfer（Euronet 旗下国际汇款） =====
  - DOMAIN-SUFFIX,riamoneytransfer.com         # 主域：www / www3 / app3 等官网、Web 汇款、App API 均在其下

